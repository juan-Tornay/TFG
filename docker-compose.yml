version: '3.8'
services:
  backend:
    build: ./back-end
    ports:
      - "5000:5000"
    env_file:
      - ./back-end/.env
    volumes:
      - ./back-end:/app
    depends_on:
      - mongo

  frontend:
    build: ./proyecto
    ports:
      - "3000:3000"
    volumes:
      - ./proyecto:/app

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: